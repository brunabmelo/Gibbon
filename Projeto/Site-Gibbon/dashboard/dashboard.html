        <section class="dashboard-section">

            <div class="seletores">

                    <h4>Valor atual</h4>

                    <h4>Valor atual</h4>

        function atualizarKPIs(setor, sensor) {
            // const kpis = kpiDados[setor];
            // if (!kpis) return;

            // document.getElementById('kpi1').querySelector('i').innerText = kpis.kpi1;

            // document.getElementById('kpi4').querySelector('i').innerText = kpis.kpi4;
            // document.getElementById('kpi5').querySelector('i').innerText = kpis.kpi5;

            const kpis = dadosSetores[setor].sensores[sensor];
            if (!kpis) return;

            const metricas = dadosSetores[setor].metricas
            if (!metricas) return;
            
            document.getElementById('kpi1').querySelector('.medida').innerHTML = kpis.kpi1
            document.getElementById('kpi2').querySelector('.medida').innerHTML = kpis.kpi2
            document.getElementById('kpi3').querySelector('.medida').innerHTML = kpis.kpi3
            
            document.getElementById('metrica1').querySelector('.medida').innerHTML = metricas.metrica1
            document.getElementById('metrica2').querySelector('.medida').innerHTML = metricas.metrica2
            document.getElementById('metrica3').querySelector('.medida').innerHTML = metricas.metrica3
        }

        function atualizarGraficos() {
            const setor = document.getElementById("sltsetor").value;
            const sensor = document.getElementById("sltsensor").value;

            if (setor === "" || sensor === "") {
                // document.querySelector('.kpi-container').style.display = 'none';
                // document.querySelector('.graficos').style.display = 'none';
                return;
            }

            // document.querySelector('.kpi-container').style.display = 'flex';
            // document.querySelector('.graficos').style.display = 'flex';
            atualizarKPIs(setor, sensor);

            // const novosDados = dadosPorSetor[setor];
            const novosDados = dadosSetores[setor].sensores[sensor]
            const ctx1 = document.getElementById('myChart1').getContext('2d');
            const ctx2 = document.getElementById('myChart2').getContext('2d');

            if (!chart1) {
                chart1 = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['DIA-01', 'DIA-02', 'DIA-03', 'DIA-04', 'DIA-05', 'DIA-06', 'DIA-07'],
                        datasets: [{
                            label: 'Horas iluminadas por dia',
                            data: novosDados.barData,
                            backgroundColor: '#3498db',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } else {

                chart1.data.datasets[0].data = novosDados.barData;
                chart1.update();
            }


            if (!chart2) {
                chart2 = new Chart(ctx2, {
                    type: 'line',
                    data: {
                        labels: ['09:01:01', '09:01:02', '09:01:03', '09:01:04', '09:01:05', '09:01:06', '09:01:07'],
                        datasets: [{
                            label: 'µmol/m²/s',
                            data: novosDados.lineData,
                            borderColor: 'red',
                            backgroundColor: 'rgba(255, 0, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } else {

            }

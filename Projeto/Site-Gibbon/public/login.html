<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibbon</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <link rel="icon" href="./assets/images/logos/tomate.ico">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/styleLogin.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
    <header>
        <a class="logo-container" href="./index.html">
            <img src="./assets/images/logos/gibbon-logo.png" alt="logo Gibbon">
        </a>
        <nav>
            <ul class="links-header">
                <li class="btn-cta"><a href="./index.html#home">Home</a></li>
                <li class="btn-cta"><a href="./index.html#simulador">Simulador</a></li>
                <li class="btn-cta"><a href="./index.html#sobre-nos">Sobre nós</a></li>
                <li class="btn-cta"><a href="./index.html#principios">Princípios</a></li>
                <li class="btn-cta"><a href="./index.html#contate-nos">Contate-nos</a></li>
                <li class="btn-cta btn-entre"><a href="./login.html">Entre</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="login-card">
            <h3>Login</h3>
            <div class="login-form">
                <div>
                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="login" placeholder="e-mail" inputmode="text" required>
                </div>
                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Senha" required>
                </div>
                <button onclick="login()">Entrar</button>
            </div>
            <a href="">Esqueci minha senha</a>
        </section>
    </main>
    <footer>
        <div class="logo-redes-sociais">
            <a class="logo-container" href="./index.html">
                <img src="./assets/images/logos/gibbon-logo.png" alt="logo Gibbon">
            </a>
            <ul class="redes-sociais">
                <li><a href=""><img src="./assets/images/logos/facebook.png" alt="logo do facebook"></a></li>
                <li><a href=""><img src="./assets/images/logos/linkedin.png" alt="logo do linkedin"></a></li>
                <li><a href=""><img src="./assets/images/logos/youtube.png" alt="logo do youtube"></a></li>
                <li><a href=""><img src="./assets/images/logos/instagram.png" alt="logo do instagram"></a></li>
            </ul>
        </div>
        <div class="footer-info">
            <nav>
                <ul class="links-footer">
                    <li class="btn-cta"><a href="./index.html#home">Home</a></li>
                    <li class="btn-cta"><a href="./index.html#simulador">Simulador</a></li>
                    <li class="btn-cta"><a href="./index.html#sobre-nos">Sobre nós</a></li>
                    <li class="btn-cta"><a href="./index.html#principios">Princípios</a></li>
                    <li class="btn-cta"><a href="./index.html#contate-nos">Contate-nos</a></li>
                </ul>
            </nav>
            <div class="contatos">
                <h4>Fale com Gibbon</h4>
                <span>Sac 0800 987 6543</span>
                <span>Email <br>gibbon@gibbon.com</span>
            </div>
        </div>
    </footer>

    <script src="./js/login.js"></script>
    <script>
        function login() {
            var email = document.getElementById("email").value;
            var senha = document.getElementById("senha").value;

            fetch("/empresa/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, senha })
            })
                .then(res => res.json()
                    .then(data => {

                        if (data.message === "Login realizado com sucesso!") {
                            alert(data.message);

                            sessionStorage.ID_FUNCIONARIO = data.id_funcionario
                            sessionStorage.NOME = data.nome
                            sessionStorage.SOBRENOME = data.sobrenome
                            sessionStorage.EMAIL = data.email
                            sessionStorage.SENHA = data.senha
                            sessionStorage.ID_EMPRESA = data.id_empresa
                            sessionStorage.NIVEIS_ACESSO = JSON.stringify(data.niveis_acesso)

                            window.location = "dashboard/dashboard.html";
                        } else {
                            alert("Email ou senha inválidos");
                        }
                    }))
                .catch(err => {
                    console.error(err);
                    alert("Erro na requisição");
                });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="./assets/images/logos/tomate.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-container">
            <div class="perfil">
                <div class="perfil-card">
                    <h2>Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
                <button onclick="abrirSuporte()">Suporte</button>
            </div>
            <div class="navbar">
                <ul>
                    <li><a href="./avisos.html">Avisos</a></li>
                    <li><a  href="./dashboard.html">Gráficos</a></li>
                    <li><a href="./funcionarios.html">Funcionários</a></li>
                    <li><a href="./estufas.html">Estufas</a></li>
                    <li><a class="selecionado" href="./sensores.html">Sensores</a></li>
                </ul>
            </div>
            <div class="sair">
                <button onclick="sair()">Sair</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="cadastro-card">
            <h3>Cadastrar Sensor</h3>
            <div class="cadastro-form">
                <div class="ipt-container">
                    <label for="nome_estufa">Nome do sensor*</label>
                    <input type="text" id="nome_estufa" name="nome" placeholder="Nome do sensor" inputmode="text" required>
                    <label for="sel-estufa">Estufa*</label>
                    <select name="estufa" id="sel-estufa">
                        <option value="0">Selecione uma estufa...</option>
                    </select>

                </div>

                <button onclick="cadastrar()">Cadastrar</button>
            </div>

        </section>

    </main>

    <script src="../js/dashboard.js"></script>
</body>

</html>
<script>
    const select_estufas = document.getElementById('sel-estufa')
    fetch(`/estufas/listar/${sessionStorage.getItem('ID_EMPRESA')}`)
        .then(resposta => {
            resposta.json().then(vt_estufas => {
                for (let i = 0; i < vt_estufas.length; i++) {
                    const estufa = vt_estufas[i];
                    select_estufas.innerHTML += `
                        <option value="${estufa.idEstufa}">
                            <h3>${estufa.nome}</h3>
                        </option>
                    `
                }
            })
        })

    function cadastrar() {
        let nome = nome_estufa.value;
        let select_estufas = document.getElementById('sel-estufa')
        let id_estufa = select_estufas.value;

        fetch(`/sensores/cadastrar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome,
                id_estufa
            })
        })
            .then(res => {
                if (res.ok) {
                    alert("Sensor cadastrado com sucesso!");
                    window.location = "./sensores.html";
                } else {
                    alert("Erro ao cadastrar sensor");
                }
            });
    }
    function abrirSuporte() {
        let vt_niveis_acesso = []

        JSON.parse(sessionStorage.NIVEIS_ACESSO).forEach(json => {
            vt_niveis_acesso.push(json.nivel)
        });

        console.log(vt_niveis_acesso.includes('Suporte N1'));
        console.log(vt_niveis_acesso.includes('Suporte N2'));
        console.log(vt_niveis_acesso.includes('Suporte N3'));
        

        if (vt_niveis_acesso.includes('Suporte N3') || vt_niveis_acesso.includes('Suporte N2') || vt_niveis_acesso.includes('Suporte N1')) {
            window.location.href = "./suporte.html";
        } else {
            alert("Acesso restrito! Apenas suporte pode acessar esta página.");
        }
    }
</script>

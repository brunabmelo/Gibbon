<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <main>
        <nav class="sidebar">
            <div class="sidebar-container">
                <div class="perfil">
                    <div class="perfil-card">
                        <h2>Nome Usuário</h2>
                    </div>
                    <a href="./perfil.html">Perfil</a>
                    <button onclick="abrirSuporte()">Suporte</button>
                </div>
                <div class="navbar">
                    <ul>
                        <li><a href="./avisos.html">Avisos</a></li>
                        <li><a class="selecionado" href="./dashboard.html">Gráficos</a></li>
                        <li><a href="./funcionarios.html">Funcionário</a></li>
                        <li><a href="./estufas.html">Estufas</a></li>
                        <li><a href="./sensores.html">Sensores</a></li>
                    </ul>
                </div>
                <div class="sair">
                    <button onclick="sair()">Sair</button>
                </div>
            </div>
        </nav>
        <div id="container">
            <h1>BobIA</h1>
            <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
            <br><br>
            <button onclick="gerarResposta()">Gerar Resposta</button>
            <h3>Resposta da IA:</h3>
            <div id="resposta"></div>
        </div>
    </main>

</body>
<script>

    async function gerarResposta() {
        const pergunta = document.getElementById('pergunta').value;

        const response = await fetch('/perguntar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ pergunta })
        });

        const data = await response.json();

        resposta.style.display = 'block';
        document.getElementById('resposta').innerText = data.resultado;
    }

</script>


</html>

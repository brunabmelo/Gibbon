<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../assets/images/logos/tomate.ico">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">

    <script src="../js/dashboard.js"></script>
</head>

<body onload="validarSessao()">
    <nav class="sidebar">
        <div class="sidebar-container">
            <div class="perfil">
                <div class="perfil-card">
                    <h2 id="nome_usuario_sidebar">Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
                <button onclick="abrirSuporte()">Suporte</button>
            </div>
            <div class="navbar">
                <ul>
                    <li><a href="./avisos.html">Avisos</a></li>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a href="./funcionarios.html">Funcionários</a></li>
                    <li><a href="./estufas.html">Estufas</a></li>
                    <li><a href="./sensores.html">Sensores</a></li>
                </ul>
            </div>
            <div class="sair">
                <button onclick="sair()">Sair</button>
            </div>
        </div>
    </nav>
    <main>
        <div class="bobIA-container">
            <h1>BobIA</h1>
            <div class="textarea">
                <textarea id="inputPergunta" type="text" placeholder="Digite a pergunta..."></textarea>
                <br><br>
                <button onclick="gerarResposta()">Gerar Resposta</button>
            </div>

            <div id="resposta" class="resposta-form">
                <p>Aqui terá a resposta do BobIA. Espere um pouco ao clicar no botão para gerar a resposta, ele pode
                    demorar um pouco para processar...</p>
            </div>
        </div>
        </div>
    </main>

</body>
<script>

    async function gerarResposta() {
        const pergunta = document.getElementById("inputPergunta").value;

        try {
            const req = await fetch("/perguntar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ pergunta })
            });

            if (req.status != 500) {

                const data = await req.json();

                document.getElementById("resposta").innerHTML = `<p>${data.resultado}</p>`;
            }
            else {
                throw new Error('Erro ao gerar resposta')
            }
        } catch (error) {
            console.error(error);
            document.getElementById("resposta").innerHTML =
                "<p>Erro ao gerar resposta.</p>";
        }
    }

    function abrirSuporte() {
        let vt_niveis_acesso = []

        JSON.parse(sessionStorage.NIVEIS_ACESSO).forEach(json => {
            vt_niveis_acesso.push(json.nivel)
        });

        console.log(vt_niveis_acesso.includes('Suporte N1'));
        console.log(vt_niveis_acesso.includes('Suporte N2'));
        console.log(vt_niveis_acesso.includes('Suporte N3'));


        if (vt_niveis_acesso.includes('Suporte N3') || vt_niveis_acesso.includes('Suporte N2') ||
            vt_niveis_acesso.includes('Suporte N1')) {
            window.location.href = "./suporte.html";
        } else {
            alert("Acesso restrito! Apenas suporte pode acessar esta página.");
        }
    }

</script>


</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="./assets/images/logos/tomate.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body onload="listarFuncionarios()">
    <nav class="sidebar">
        <div class="sidebar-container">
            <div class="perfil">
                <div class="perfil-card">
                    <h2>Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
                <button onclick="abrirSuporte()">Suporte</button>
            </div>
            <div class="navbar">
                <ul>
                    <li><a href="./avisos.html">Avisos</a></li>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a class="selecionado" href="./funcionarios.html">Funcionários</a></li>
                    <li><a href="./estufas.html">Estufas</a></li>
                    <li><a href="./sensores.html">Sensores</a></li>
                </ul>
            </div>
            <div class="sair">
                <button onclick="sair()">Sair</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="funcionarios-container">
            <div class="funcionarios-header">
                <h2>Funcionários Cadastrados</h2>
                <a href="./cadastro-funcionario.html"><img class="icone-mais" src="../assets/images/icons/plus-icon.png"
                        alt="Símbolo de mais"></a>
            </div>

            <ul id="lista-funcionarios">
                <!--Funcionarios-->
                <li>
                            <div class="funcionario-info">
                                <h3>${funcionario.nome} ${funcionario.sobrenome}</h3>
                                <p class="funcionario-email">${funcionario.email}</p>
                                <ul id="lista_${i}" class="lista-nivel-acesso"><li>
                                            ${vt_niveis_acesso[i].nivel}
                                        </li>
                                    <li>
                                            ${vt_niveis_acesso[i].nivel}
                                        </li></ul>
                            </div>
                        </li>

            </ul>
        </div>
    </main>

    <script src="../js/dashboard.js"></script>
</body>

</html>

<script>
    function listarFuncionarios() {
        fetch(`/funcionarios/listar/${sessionStorage.getItem('ID_EMPRESA')}`).then(resposta => {
            resposta.json().then(vt_funcionarios => {
                console.log(vt_funcionarios);

                const ul_lista_funcionarios = document.getElementById('lista-funcionarios')
                for (let i = 0; i < vt_funcionarios.length; i++) {
                    const funcionario = vt_funcionarios[i];
                    ul_lista_funcionarios.innerHTML += `
                        <li>
                            <div class="funcionario-info">
                                <h3>${funcionario.nome} ${funcionario.sobrenome}</h3>
                                <p class="funcionario-email">${funcionario.email}</p>
                                <ul id="lista_${i}" class="lista-nivel-acesso"></ul>
                            </div>
                        </li>
                    `

                    fetch(`/funcionarios/niveisAcesso`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        id_empresa: funcionario.fkEmpresa,
                        id_funcionario: funcionario.idFuncionario
                    })
                })
                    .then(resultado => {
                        if (resultado.ok) {
                            resultado.json().then(vt_niveis_acesso => {
                                const lista = document.getElementById(`lista_${i}`)
                                for (let i = 0; i < vt_niveis_acesso.length; i++) {
                                    lista.innerHTML += `
                                        <li>
                                            ${vt_niveis_acesso[i].nivel}
                                        </li>
                                    `
                                }
                            })
                        }
                        else {
                            console.log('Erro ao buscar níveis de acesso dos funcionários na lista de funcionários');
                        }
                    })

                }

            })
        })
    }
    function abrirSuporte() {
        let fkNivelAcessoUsuario = Number(localStorage.getItem("fkNivelAcessoUsuario"));
        if (fkNivelAcessoUsuario === 6) {
            window.location.href = "./bobIA.html"; // só Suporte N3
        } else {
            alert("Acesso restrito! Apenas Suporte N3 pode acessar esta página.");
        }
    }
</script>

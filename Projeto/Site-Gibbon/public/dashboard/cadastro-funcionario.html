<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="./assets/images/logos/tomate.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-container">
            <div class="perfil">
                <div class="perfil-card">
                    <h2>Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
                <button onclick="abrirSuporte()">Suporte</button>
            </div>
            <div class="navbar">
                <ul>
                    <li><a href="./avisos.html">Avisos</a></li>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a class="selecionado" href="./funcionarios.html">Funcionários</a></li>
                    <li><a href="./estufas.html">Estufas</a></li>
                    <li><a href="./sensores.html">Sensores</a></li>
                </ul>
            </div>
            <div class="sair">
                <button onclick="sair()">Sair</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="cadastro-card">
            <h3>Cadastrar Funcionário</h3>
            <div class="cadastro-form">
                <div class="ipt-container">
                    <label for="nome1">Nome*</label>
                    <input type="text" id="nome1" name="nome" placeholder="Nome" inputmode="text" required>
                </div>
                <div class="ipt-container">
                    <label for="sobrenome">Sobrenome*</label>
                    <input type="text" id="sobrenome1" name="sobrenome" placeholder="Sobrenome" inputmode="text"
                        required>
                </div>
                <div class="ipt-container">
                    <label for="email">E-mail*</label>
                    <input type="text" id="email1" name="e-mail" placeholder="email@email.com" inputmode="text"
                        required>
                </div>
                <div class="ipt-container">
                    <label>Nível de acesso*</label>
                    <div class="nivel-acesso-container">
                        <div class="ipt-nivel-container">
                             <input type="checkbox" name="admin" id="admin" value="1">
                            <label for="admin">Administrador</label>
                           
                        </div>
                        <div class="ipt-nivel-container">
                            <input type="checkbox" name="editor" id="editor" value="2">
                            <label for="editor">Editor</label>
                        </div>
                        <div class="ipt-nivel-container">
                            <input type="checkbox" name="visualizador" id="visualizador" value="3">
                            <label for="visualizador">Visualizador</label>
                        </div>
                        <div class="ipt-nivel-container">
                            <input type="checkbox" name="suporte_N1" id="suporte_N1" value="4">
                            <label for="suporte_N1">Suporte N1</label>
                        </div>
                        <div class="ipt-nivel-container">
                            <input type="checkbox" name="suporte_N2" id="suporte_N2" value="5">
                            <label for="suporte_N2">Suporte N2</label>
                        </div>
                        <div class="ipt-nivel-container">
                            <input type="checkbox" name="suporte_N3" id="suporte_N3" value="6">
                            <label for="suporte_N3">Suporte N3</label>
                        </div>
                    </div>
                </div>
                <div class="ipt-container">
                    <label for="senha">Senha*</label>
                    <input type="password" id="senha1" name="senha" placeholder="Senha" inputmode="text" required>
                </div>
                <div class="ipt-container">
                    <label for="confirmacao-senha">Confirmação da Senha*</label>
                    <input type="password" id="confirmacao-senha1" name="confirmacao-senha"
                        placeholder="Confirme sua senha" inputmode="text" required>
                </div>
                <button onclick="cadastrar()">Cadastrar</button>
            </div>

        </section>

    </main>

    <script src="../js/dashboard.js"></script>
</body>

</html>
<script>
    function cadastrar() {
        let nome = nome1.value;
        let sobrenome = sobrenome1.value;
        let email = email1.value;
        let senha = senha1.value;
        let confirmacao = document.getElementById("confirmacao-senha1").value;
        let niveisSelecionados = []

        let niveisAcesso = document.querySelectorAll('.ipt-nivel-container input')

        niveisAcesso.forEach(ipt_nivel => {
            if (ipt_nivel.checked) {
                niveisSelecionados.push(ipt_nivel.value)
            }
        })

        if (niveisSelecionados.length == 0) {
            alert('Selecione pelo menos um nível de acesso')
            return
        }
        if (senha !== confirmacao) {
            alert("As senhas não conferem!");
            return;
        }

        fetch("/funcionarios/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome,
                sobrenome,
                email,
                senha,
                fkEmpresa: sessionStorage.getItem('ID_EMPRESA')
            })
        })
            .then(res => {
                if (res.ok) {

                    fetch('/empresa/login', {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, senha })
                    })
                        .then(resposta => {
                            resposta.json().then(data => {
                                console.log('níveis de acesso selecionados: ', niveisSelecionados);
                                console.log('usuário que acabou de ser cadastrado: ', data);

                                for (let i = 0; i < niveisSelecionados.length; i++) {
                                    fetch('/funcionarios/acessoFuncionario', {
                                        method: "POST",
                                        headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({
                                            id_funcionario: data.id_funcionario,
                                            id_empresa: data.id_empresa,
                                            id_nivel_acesso: niveisSelecionados[i]
                                        })
                                    })
                                }
                            })
                        })

                    alert("Funcionário cadastrado com sucesso!");
                    window.location = "./funcionarios.html";
                } else {
                    alert("Erro ao cadastrar funcionário");
                }
            })
            .catch(err => {
                console.error("Erro na requisição:", err);
                alert("Erro ao conectar com o servidor");
            });
    }
    
    function abrirSuporte() {
        let vt_niveis_acesso = []

        JSON.parse(sessionStorage.NIVEIS_ACESSO).forEach(json => {
            vt_niveis_acesso.push(json.nivel)
        });

        console.log(vt_niveis_acesso.includes('Suporte N1'));
        console.log(vt_niveis_acesso.includes('Suporte N2'));
        console.log(vt_niveis_acesso.includes('Suporte N3'));
        

        if (vt_niveis_acesso.includes('Suporte N3') || vt_niveis_acesso.includes('Suporte N2') || vt_niveis_acesso.includes('Suporte N1')) {
            window.location.href = "./suporte.html";
        } else {
            alert("Acesso restrito! Apenas suporte pode acessar esta página.");
        }
    }
</script>

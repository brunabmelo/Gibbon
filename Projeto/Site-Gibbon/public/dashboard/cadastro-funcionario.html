<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <nav class="sidebar">
        <div>
            <div class="perfil">
                <div class="perfil-card">
                    <img class="avatar-icon" src="../assets/images/generic-avatar.png" alt="Foto de perfil">
                    <h2>Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
            </div>
            <button onclick="abrirSuporte()">Suporte</button>
            <div class="navbar">
                <ul>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a class="selecionado" href="./funcionarios.html">Cadastrar Funcionário</a></li>
                    <li><a href="./notificacoes.html">Notificação</a></li>
                </ul>
            </div>
        </div>
        <button onclick="sair()">Sair</button>
    </nav>

    <main class="container">
        <section class="cadastro-card">
            <h3>Cadastrar Funcionário</h3>
            <div class="cadastro-form">
                <div class="ipt-container">
                    <label for="nome1">Nome*</label>
                    <input type="text" id="nome1" name="nome" placeholder="Nome" inputmode="text" required>
                </div>
                <div class="ipt-container">
                    <label for="sobrenome">Sobrenome*</label>
                    <input type="text" id="sobrenome1" name="sobrenome" placeholder="Sobrenome" inputmode="text"
                        required>
                </div>
                <div class="ipt-container">
                    <label for="email">E-mail*</label>
                    <input type="text" id="email1" name="e-mail" placeholder="email@email.com" inputmode="text" required>
                </div>
                <div class="ipt-container">
                    <label for="sel_NivelAcesso">Nível de acesso*</label>
                    <select name="NivelAcesso" id="sel_NivelAcesso">
                        <option value="">Selecione o nível de acesso</option>
                        <option value="1">Administrador</option>
                        <option value="2">Editor</option>
                        <option value="3">Visualizador</option>
                        <option value="4">Suporte N1</option>
                        <option value="5">Suporte N2</option>
                        <option value="6">Suporte N3</option>
                    </select>
                </div>
                <div class="ipt-container">
                    <label for="senha">Senha*</label>
                    <input type="password" id="senha1" name="senha" placeholder="Senha" inputmode="text" required>
                </div>
                <div class="ipt-container">
                    <label for="confirmacao-senha">Confirmação da Senha*</label>
                    <input type="password" id="confirmacao-senha1" name="confirmacao-senha"
                        placeholder="Confirme sua senha" inputmode="text" required>
                </div>
                <button onclick="cadastrar()">Cadastrar</button>
            </div>

        </section>

    </main>

    <script src="../js/dashboard.js"></script>
</body>

</html>
<script>
    function cadastrar() {
     let nome = nome1.value;
    let sobrenome = sobrenome1.value;
    let email = email1.value;
    let nivelAcesso = parseInt(sel_NivelAcesso.value);
    let senha = senha1.value;
    let confirmacao = document.getElementById("confirmacao-senha1").value;

    if (senha !== confirmacao) {
        alert("As senhas não conferem!");
        return;
    }

    
    const fkEmpresa = 1; 

    fetch("/cadastrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nome,
            sobrenome,
            email,
            nivelAcesso,
            senha,
            fkEmpresa
        })
    })
    .then(res => {
        if (res.ok) {
            alert("Funcionário cadastrado com sucesso!");
            window.location = "./funcionarios.html";
        } else {
            alert("Erro ao cadastrar funcionário");
        }
    })
    .catch(err => {
        console.error("Erro na requisição:", err);
        alert("Erro ao conectar com o servidor");
    });
}
  function abrirSuporte() {
    let fkNivelAcessoUsuario = Number(localStorage.getItem("fkNivelAcessoUsuario"));
    if (fkNivelAcessoUsuario === 6) {
        window.location.href = "./bobIA.html"; // só Suporte N3
    } else {
        alert("Acesso restrito! Apenas Suporte N3 pode acessar esta página.");
    }
}
</script>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="./assets/images/logos/tomate.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body onload="listarEstufas(sessionStorage.getItem('ID_EMPRESA'))">
    <nav class="sidebar">
        <div class="sidebar-container">
            <div class="perfil">
                <div class="perfil-card">
                    <h2>Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
                <button onclick="abrirSuporte()">Suporte</button>
            </div>
            <div class="navbar">
                <ul>
                    <li><a href="./avisos.html">Avisos</a></li>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a href="./funcionarios.html">Funcionários</a></li>
                    <li><a class="selecionado" href="./estufas.html">Estufas</a></li>
                    <li><a href="./sensores.html">Sensores</a></li>
                </ul>
            </div>
            <div class="sair">
                <button onclick="sair()">Sair</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="funcionarios-container">
            <div class="funcionarios-header">
                <h2>Estufas Cadastradas</h2>
                <a href="./cadastro-estufas.html"><img class="icone-mais" src="../assets/images/icons/plus-icon.png"
                        alt="Símbolo de mais"></a>
            </div>

            <ul id="lista-estufas">
                <!--ESTUFAS-->


            </ul>
        </div>
    </main>

    <script src="../js/dashboard.js"></script>
</body>

</html>

<script>
    function listarEstufas(id_empresa) {
        fetch(`/estufas/listar/${id_empresa}`).then(resposta => {
            resposta.json().then(vt_estufas => {
                const ul_lista_estufas = document.getElementById('lista-estufas')
                for (let i = 0; i < vt_estufas.length; i++) {
                    const estufa = vt_estufas[i];
                    ul_lista_estufas.innerHTML += `
                        <li>
                            <div class="estufas-info">
                                <h3>${estufa.nome}</h3>
                            </div>
                        </li>
                    `
                }
            })
        })
    }
    
    function abrirSuporte() {
        let vt_niveis_acesso = []

        JSON.parse(sessionStorage.NIVEIS_ACESSO).forEach(json => {
            vt_niveis_acesso.push(json.nivel)
        });

        console.log(vt_niveis_acesso.includes('Suporte N1'));
        console.log(vt_niveis_acesso.includes('Suporte N2'));
        console.log(vt_niveis_acesso.includes('Suporte N3'));
        

        if (vt_niveis_acesso.includes('Suporte N3') || vt_niveis_acesso.includes('Suporte N2') || vt_niveis_acesso.includes('Suporte N1')) {
            window.location.href = "./suporte.html";
        } else {
            alert("Acesso restrito! Apenas suporte pode acessar esta página.");
        }
    }
</script>

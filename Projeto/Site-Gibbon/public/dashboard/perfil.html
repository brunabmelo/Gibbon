<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="./assets/images/logos/tomate.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-container">
            <div class="perfil">
                <div class="perfil-card">
                    <h2>Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
                <button onclick="abrirSuporte()">Suporte</button>
            </div>
            <div class="navbar">
                <ul>
                    <li><a href="./avisos.html">Avisos</a></li>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a href="./funcionarios.html">Funcionários</a></li>
                    <li><a href="./estufas.html">Estufas</a></li>
                    <li><a href="./sensores.html">Sensores</a></li>
                </ul>
            </div>
            <div class="sair">
                <button onclick="sair()">Sair</button>
            </div>
        </div>
    </nav>

    <main>
        <section class="perfil-section">
            <div class="perfil-form">
                <div class="ipt-container">
                    <label for="nome-completo">Nome Completo</label>
                    <input type="text" id="nome-completo" placeholder="Nome" disabled>
                </div>
                <div class="ipt-container">
                    <label for="e-mail">E-mail</label>
                    <input type="text" id="e-mail" placeholder="email@email.com" inputmode="numeric" disabled>
                </div>
                <div class="ipt-container">
                    <label for="senha-atual">Senha atual</label>
                    <input type="password" id="senha-atual" placeholder="Senha atual" required>
                </div>
                <div class="ipt-container">
                    <label for="nova-senha">Nova senha</label>
                    <input type="password" id="nova-senha" placeholder="Nova senha" required>
                </div>
                <div class="ipt-container">
                    <label for="confirmacao-senha">Confirmação da Senha</label>
                    <input type="password" id="confirmacao-senha" placeholder="Nova senha" required>
                </div>
                <button onclick="atualizarPerfil()">Atualizar</button>
            </div>
        </section>
    </main>

    <script src="../js/dashboard.js"></script>
</body>

</html>
<script>
    function abrirSuporte() {
        let fkNivelAcessoUsuario = Number(localStorage.getItem("fkNivelAcessoUsuario"));
        if (fkNivelAcessoUsuario === 6) {
            window.location.href = "./bobIA.html"; // só Suporte N3
        } else {
            alert("Acesso restrito! Apenas Suporte N3 pode acessar esta página.");
        }
    }
</script>

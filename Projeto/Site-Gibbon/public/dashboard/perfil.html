<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../assets/images/logos/tomate.ico">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <script src="../js/dashboard.js"></script>
</head>

<body onload="validarSessao()">
    <nav class="sidebar">
        <div class="sidebar-container">
            <div class="perfil">
                <div class="perfil-card">
                    <h2 id="nome_usuario_sidebar">Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
                <button onclick="abrirSuporte()">Suporte</button>
            </div>
            <div class="navbar">
                <ul>
                    <li><a href="./avisos.html">Avisos</a></li>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a href="./funcionarios.html">Funcionários</a></li>
                    <li><a href="./estufas.html">Estufas</a></li>
                    <li><a href="./sensores.html">Sensores</a></li>
                </ul>
            </div>
            <div class="sair">
                <button onclick="sair()">Sair</button>
            </div>
        </div>
    </nav>

    <main>
        <section class="perfil-section">
            <div class="perfil-form">
                <div class="ipt-container">
                    <label for="nome-completo">Nome Completo</label>
                    <input type="text" id="nome-completo" placeholder="Nome" disabled>
                </div>
                <div class="ipt-container">
                    <label for="e-mail">E-mail</label>
                    <input type="text" id="e-mail" placeholder="email@email.com" inputmode="numeric" disabled>
                </div>
                <div class="ipt-container">
                    <label for="senha-atual">Senha atual</label>
                    <input type="password" id="senha-atual" placeholder="Senha atual" required>
                </div>
                <div class="ipt-container">
                    <label for="nova-senha">Nova senha</label>
                    <input type="password" id="nova-senha" placeholder="Nova senha" required>
                </div>
                <div class="ipt-container">
                    <label for="confirmacao-senha">Confirmação da Senha</label>
                    <input type="password" id="confirmacao-senha" placeholder="Nova senha" required>
                </div>
                <button onclick="atualizarPerfil()">Atualizar</button>
            </div>
        </section>
    </main>
</body>

</html>
<script>
    document.getElementById('nome-completo').value = `${sessionStorage.NOME} ${sessionStorage.SOBRENOME}`
    document.getElementById('e-mail').value = sessionStorage.EMAIL

    function abrirSuporte() {
        let vt_niveis_acesso = []

        JSON.parse(sessionStorage.NIVEIS_ACESSO).forEach(json => {
            vt_niveis_acesso.push(json.nivel)
        });

        console.log(vt_niveis_acesso.includes('Suporte N1'));
        console.log(vt_niveis_acesso.includes('Suporte N2'));
        console.log(vt_niveis_acesso.includes('Suporte N3'));


        if (vt_niveis_acesso.includes('Suporte N3') || vt_niveis_acesso.includes('Suporte N2') || vt_niveis_acesso.includes('Suporte N1')) {
            window.location.href = "./suporte.html";
        } else {
            alert("Acesso restrito! Apenas suporte pode acessar esta página.");
        }
    }

    function atualizarPerfil() {
        let senha_atual = document.getElementById('senha-atual').value
        let nova_senha = document.getElementById('nova-senha').value
        let confirmacao_senha = document.getElementById('confirmacao-senha').value

        if (senha_atual != sessionStorage.getItem('SENHA')) {
            alert('Senha incorreta')
        }
        else if (nova_senha != confirmacao_senha) {
            alert('Senhas não são iguais')
        }
        else {
            fetch('/funcionarios/atualizar', {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idFuncionarioServer: sessionStorage.getItem('ID_FUNCIONARIO'),
                    idEmpresaServer: sessionStorage.getItem('ID_EMPRESA'),
                    senhaServer: nova_senha.trim() != '' ? nova_senha : sessionStorage.getItem('SENHA')
                })
            })
                .then(resposta => {
                    if (resposta.ok) {
                        alert('Senha atualizada com sucesso')
                        document.getElementById('senha-atual').value = ''
                        document.getElementById('nova-senha').value = ''
                        document.getElementById('confirmacao-senha').value = ''
                        sessionStorage.SENHA = nova_senha
                    }
                    else {
                        alert('Erro ao atualizar senha')
                    }
                })
        }
    }
</script>

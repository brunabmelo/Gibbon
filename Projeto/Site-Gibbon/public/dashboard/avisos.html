<script>
    function buscarAvisos(ID_EMPRESA) {
        fetch(`/avisos/buscar/${ID_EMPRESA}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({

            })
        })
            .then(res => {
                if (res.ok) {

                    res.json().then(function (ul_aviso_sensor) {
                        const ul_aviso_sensor = document.getElementById('avisos-sensor')
                        for (let i = 0; i < ul_aviso_sensor.length; i++) {
                            const sensor = ul_aviso_sensor[i];
                            ul_lista_funcionarios.innerHTML += `
                              <li class="alerta-bar">
                                 <div class="titulo-container">
                                     <h2>${sensor.Sensor}</h2>
                                  </div>
                                     <p>
                                        Estufa ${sensor.LocaldaEstufa}                      
                                    </p>
                             </li>
                             `

                        }


                    })


                } else {
                    alert("Erro ao cadastrar funcionário");
                }
            });
    }
    function abrirSuporte() {
        let fkNivelAcessoUsuario = Number(localStorage.getItem("fkNivelAcessoUsuario"));
        if (fkNivelAcessoUsuario === 6) {
            window.location.href = "./bobIA.html"; // só Suporte N3
        } else {
            alert("Acesso restrito! Apenas Suporte N3 pode acessar esta página.");
        }
    }
</script>

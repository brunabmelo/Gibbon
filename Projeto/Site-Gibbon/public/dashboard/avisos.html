<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="./assets/images/logos/tomate.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body onload="buscarAvisos(sessionStorage.getItem(ID_EMPRESA))">
    <!--MENU-->
    <nav class="sidebar">
        <div class="sidebar-container">
            <div class="perfil">
                <div class="perfil-card">
                    <h2>Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
                <button onclick="abrirSuporte()">Suporte</button>
            </div>
            <div class="navbar">
                <ul>
                    <li><a class="selecionado" href="./avisos.html">Avisos</a></li>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a href="./funcionarios.html">Funcionários</a></li>
                    <li><a href="./estufas.html">Estufas</a></li>
                    <li><a href="./sensores.html">Sensores</a></li>
                </ul>
            </div>
            <div class="sair">
                <button onclick="sair()">Sair</button>
            </div>
        </div>
    </nav>
    <!--FIM MENU-->

    <main>
        <section class="alertas">
            <h1>Painel de Alerta</h1>
            <ul id="avisos-sensor" class="alerta-card">
                <li class="alerta-bar">
                    <div class="titulo-container">
                        <h2>Sensor A</h2>
                    </div>
                    <p>
                        Estufa Y
                    </p>
                </li>
            </ul>
        </section>
    </main>


</body>

</html>

<script>
    function buscarAvisos(ID_EMPRESA) {
        const dataAtual = new Date()

        let dataBrasil = dataAtual.toLocaleString('pt-br')

        dataBrasil = dataBrasil.replace(',', '')

        const [data, hora] = dataBrasil.split(' ');
        const [dia, mes, ano] = data.split('/');
        const dataFormatada = `${ano}-${mes}-${dia} ${hora}`;

        fetch(`/avisos/buscar/${ID_EMPRESA}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                dataHora: dataFormatada
            })
        })
            .then(res => {
                if (res.ok) {

                    if (res.status == 200) {
                        res.json().then(function (sensores) {
                            const ul_aviso_sensor = document.getElementById('avisos-sensor')
                            for (let i = 0; i < sensores.length; i++) {
                                const sensor = ul_aviso_sensor[i];
                                ul_aviso_sensor.innerHTML += `
                                    <li class="alerta-bar">
                                        <div class="titulo-container">
                                            <h2>${sensor.sensor}</h2>
                                        </div>
                                        <p>
                                            Estufa ${sensor.estufa}                      
                                        </p>
                                    </li>
                                `
                            }
                            setTimeout(() => buscarAvisos(ID_EMPRESA), 2000)

                        })
                    } else if (res.status == 204) {
                        const ul_aviso_sensor = document.getElementById('avisos-sensor')
                        ul_aviso_sensor.innerHTML = `Nenhum sensor fora do ideal`
                        setTimeout(() => buscarAvisos(ID_EMPRESA), 2000)
                    }

                } else {
                    alert("Erro ao buscar avisos");
                    setTimeout(() => buscarAvisos(ID_EMPRESA), 2000)
                }
            });
    }
    
    function abrirSuporte() {
        let vt_niveis_acesso = []

        JSON.parse(sessionStorage.NIVEIS_ACESSO).forEach(json => {
            vt_niveis_acesso.push(json.nivel)
        });

        console.log(vt_niveis_acesso.includes('Suporte N1'));
        console.log(vt_niveis_acesso.includes('Suporte N2'));
        console.log(vt_niveis_acesso.includes('Suporte N3'));
        

        if (vt_niveis_acesso.includes('Suporte N3') || vt_niveis_acesso.includes('Suporte N2') || vt_niveis_acesso.includes('Suporte N1')) {
            window.location.href = "./suporte.html";
        } else {
            alert("Acesso restrito! Apenas suporte pode acessar esta página.");
        }
    }
</script>

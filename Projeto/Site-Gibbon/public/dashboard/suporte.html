<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gibbon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styleDashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body onload="verificarNivelAcesso()">
    <nav class="sidebar">
        <div>
            <div class="perfil">
                <div class="perfil-card">
                    <img class="avatar-icon" src="../assets/images/generic-avatar.png" alt="Foto de perfil">
                    <h2>Nome Usuário</h2>
                </div>
                <a href="./perfil.html">Perfil</a>
            </div>
            <button onclick="abrirSuporte()">Suporte</button>
            <div class="navbar">
                <ul>
                    <li><a href="./dashboard.html">Gráficos</a></li>
                    <li><a class="selecionado" href="./funcionarios.html">Cadastrar Funcionário</a></li>
                    <li><a href="./notificacoes.html">Notificação</a></li>
                </ul>
            </div>
        </div>
        <button onclick="sair()">Sair</button>
    </nav>

    <main>
        <div class="suporte-container">
            <!-- coloque a documentação, jira e fluxograma aqui -->

            <div id="bobia_btn_container"></div>
        </div>
    </main>

    <script src="../js/dashboard.js"></script>
</body>

</html>

<script>
    function verificarNivelAcesso() {
        let vt_niveis_acesso = []

        fetch("/funcionarios/niveisAcesso", {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id_empresa: sessionStorage.getItem('ID_EMPRESA'),
                id_funcionario: sessionStorage.getItem('ID_FUNCIONARIO')
            })
        }).then(function (resposta) {
            if(resposta.ok) {
                resposta.json().then((array) => {
                    for(let i = 0; i < array.length; i++) {
                        let nivel = array[i]
                        vt_niveis_acesso.push(nivel)
                    }

                    if(vt_niveis_acesso.includes('Suporte N3')) {
                        document.getElementById('bobia_btn_container').innerHTML = '<a href="./bobIA.html">Acessar Bob IA</a>'
                    }
                })
            }
            else {
                console.log('Houve um erro ao tentar buscar níveis de acesso do funcionário');
            }
        })
    }
</script>

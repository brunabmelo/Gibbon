<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gibbon</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styleLogin.css">
</head>

<body>

    <div id="header"></div>

    <main class="container">
        <section class="login-card">
            <p class="subtitulo">Login</p>
            <form>
                <label for="email">CNPJ ou CPF</label>
                <input type="email" id="email" placeholder="CNPJ ou CPF" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Senha" required>

                <button type="submit">Entrar</button>
                <button class="registro" href="#">Cadastre-se</button>
                <label for="recuperarSenha">Esqueci minha senha</label>
            </form>
        </section>
    </main>

    <div id="footer"></div>

    <script src="/js/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gibbon</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/styleLogin.css">
</head>

<body>
    <header>
        <a class="logo-container" href="./index.html">
            <img src="./assets/images/logos/gibbon-logo.png" alt="logo Gibbon">
        </a>
        <nav>
            <ul class="links-header">
                <li class="btn-cta"><a href="./index.html#home">Home</a></li>
                <li class="btn-cta"><a href="./index.html#simulador">Simulador</a></li>
                <li class="btn-cta"><a href="./index.html#sobre-nos">Sobre nós</a></li>
                <li class="btn-cta"><a href="./index.html#principios">Princípios</a></li>
                <li class="btn-cta"><a href="./index.html#contate-nos">Contate-nos</a></li>
                <li class="btn-cta btn-entre"><a href="./login.html">Entre</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <section class="login-card">
            <h3>Login</h3>
            <form>
                <label for="login">CNPJ ou CPF</label>
                <input type="text" id="CNPJ_CPF" name="login" placeholder="CNPJ ou CPF" inputmode="numeric" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Senha" required>

                <button type="submit">Entrar</button>
                <button class="registro">Cadastre-se</button>
                <a href="">Esqueci minha senha</a>
            </form>
        </section>
    </main>
    <footer>
        <div class="logo-redes-sociais">
            <a class="logo-container" href="./index.html">
                <img src="./assets/images/logos/gibbon-logo.png" alt="logo Gibbon">
            </a>
            <ul class="redes-sociais">
                <li><a href=""><img src="./assets/images/logos/facebook.png" alt="logo do facebook"></a></li>
                <li><a href=""><img src="./assets/images/logos/linkedin.png" alt="logo do linkedin"></a></li>
                <li><a href=""><img src="./assets/images/logos/youtube.png" alt="logo do youtube"></a></li>
                <li><a href=""><img src="./assets/images/logos/instagram.png" alt="logo do instagram"></a></li>
            </ul>
        </div>
        <div class="footer-info">
            <nav>
                <ul class="links-footer">
                    <li class="btn-cta"><a href="./index.html#home">Home</a></li>
                    <li class="btn-cta"><a href="./index.html#simulador">Simulador</a></li>
                    <li class="btn-cta"><a href="./index.html#sobre-nos">Sobre nós</a></li>
                    <li class="btn-cta"><a href="./index.html#principios">Princípios</a></li>
                    <li class="btn-cta"><a href="./index.html#contate-nos">Contate-nos</a></li>
                </ul>
            </nav>
            <div class="contatos">
                <h4>Fale com Gibbon</h4>
                <span>Sac 0800 987 6543</span>
                <span>Email <br>gibbon@gibbon.com</span>
            </div>
        </div>
    </footer>

    <script src="/js/login.js"></script>
</body>

</html>
